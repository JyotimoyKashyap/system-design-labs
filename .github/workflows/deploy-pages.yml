name: Deploy Mono-Repo to GitHub Pages & GHCR

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "knowledge/.obsidian/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and GHCR
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write  # Required to push to GitHub Container Registry

# Cancel any in-flight superseded deployment when a new commit is pushed
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Fast Static Build & Deploy to GitHub Pages (<45s)
  build-and-deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build:web

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Build & Publish Docker Image to GHCR (Runs only when code/infra changes, skips vault-only commits)
  publish-docker-image:
    name: Build & Publish Container Image (GHCR)
    runs-on: ubuntu-latest
    # Only publish Docker image on manual dispatch or when code/docker files change
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Docker/Code Changed
        id: check_changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'Dockerfile'
              - 'nginx.conf'
              - 'docker-compose.yml'
              - 'package*.json'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - '*-web/**'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.code == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        if: github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.code == 'true'
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_NAME"
          
          echo "Building Docker Image: $IMAGE_NAME..."
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .
          
          echo "Pushing Docker Image to GHCR..."
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
