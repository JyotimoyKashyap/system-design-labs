<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c1917" stroke-width="0.75" stroke-opacity="0.1" />
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="#f5f4f0" />
  <rect width="400" height="400" fill="url(#grid)" />
  
  <!-- Outer brutalist border frame -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#1c1917" stroke-width="4" />
  
  <!-- Stylized Geometric Avatar Representation -->
  <g transform="translate(100, 70)">
    <!-- Head / Node -->
    <rect x="50" y="30" width="100" height="110" fill="#ffffff" stroke="#1c1917" stroke-width="4" />
    <!-- Glasses -->
    <rect x="58" y="70" width="36" height="24" fill="#fdfcfb" stroke="#1c1917" stroke-width="3" />
    <rect x="106" y="70" width="36" height="24" fill="#fdfcfb" stroke="#1c1917" stroke-width="3" />
    <line x1="94" y1="82" x2="106" y2="82" stroke="#1c1917" stroke-width="3" />
    <line x1="50" y1="82" x2="58" y2="82" stroke="#1c1917" stroke-width="3" />
    <line x1="142" y1="82" x2="150" y2="82" stroke="#1c1917" stroke-width="3" />
    
    <!-- Smile / line -->
    <path d="M 85 115 Q 100 125 115 115" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="square" />
    
    <!-- Shoulders -->
    <path d="M 10 180 L 50 140 L 150 140 L 190 180 L 190 220 L 10 220 Z" fill="#1c1917" stroke="#1c1917" stroke-width="4" />
    <!-- Laptop / terminal -->
    <rect x="35" y="170" width="130" height="45" fill="#f97316" stroke="#1c1917" stroke-width="3" />
    <text x="100" y="196" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt; sys_eng</text>
  </g>

  <!-- Tagline badge -->
  <g transform="translate(200, 340)">
    <rect x="-85" y="-14" width="170" height="28" fill="#1c1917" />
    <text x="0" y="4" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">JYOTIMOY KASHYAP</text>
  </g>
</svg>
